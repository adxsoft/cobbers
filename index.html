<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colonial Cobbers Golf Club</title>
<style>
  :root {
    --green: #1f3d2b;
    --fairway: #3f6b4a;
    --paper: #f7f5ee;
    --ink: #1b241e;
    --brass: #b08a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14201a;
      --ink: #eef0e8;
      --green: #0d1812;
      --fairway: #8fb89a;
      --brass: #d3ae5c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--green);
    color: #f4efe0;
    text-align: center;
    padding: 4rem 1.5rem 3.5rem;
    border-bottom: 6px solid var(--brass);
  }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: normal;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  header p {
    margin: 0.9rem 0 0;
    font-style: italic;
    color: var(--brass);
    font-size: 1.1rem;
  }
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 3rem 1.5rem;
  }
  nav {
    width: 100%;
    max-width: 28rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  nav a {
    display: block;
    padding: 1.1rem 1.4rem;
    border: 2px solid var(--fairway);
    color: var(--ink);
    text-decoration: none;
    font-size: 1.25rem;
    text-align: center;
    border-radius: 2px;
  }
  nav a:hover, nav a:focus-visible {
    background: var(--fairway);
    color: #fff;
    outline: none;
  }
  nav a:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.9rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <header>
    <h1>Colonial Cobbers Golf Club</h1>
    <p>Member resources</p>
  </header>
  <main>
    <nav aria-label="Club links">
      <a href="Handicaps.htm">Handicap Sheet</a>
      <a href="Results.png">Latest Results</a>
    </nav>
  </main>
  <footer>&copy; Colonial Cobbers Golf Club</footer>
</body>
</html>
